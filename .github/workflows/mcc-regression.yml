name: MCC regression checks
on:
  push:
    branches: [ "fix/v0.5.174-incremental-review" ]
  pull_request:
env:
  MCC_TEST_SOURCE: Music.Collection.Cleaner.v0.05.174.pyw
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest mutagen playwright
      - name: Install Chromium for embedded browser smoke check
        run: python -m playwright install --with-deps chromium
      - name: Compile latest Python GUI
        run: python -m py_compile "Music.Collection.Cleaner.v0.05.174.pyw"
      - name: Run regression suite (layout requires browser)
        run: python -m pytest -q tests --ignore=tests/test_layout.py --ignore=tests/visual_qa.py

  windows-native:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      MCC_TEST_SOURCE: Music.Collection.Cleaner.v0.05.174.pyw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Windows GUI dependencies
        run: python -m pip install pywebview pythonnet Pillow
      - name: Test native WebView2 Release Map and Copy path
        run: python tests/native_windows_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcc-v174-native-windows-screenshot
          path: tests/screens/native-win-v174.png
          if-no-files-found: ignore
