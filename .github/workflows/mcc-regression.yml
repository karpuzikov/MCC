name: MCC regression checks
on:
  push:
    branches: [ "fix/v0.5.174-incremental-review" ]
  pull_request:
env:
  MCC_TEST_SOURCE: Music.Collection.Cleaner.v0.05.174.pyw
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest mutagen
      - name: Compile latest Python GUI
        run: python -m py_compile "Music.Collection.Cleaner.v0.05.174.pyw"
      - name: Run regression suite (layout requires browser)
        run: python -m pytest -q tests --ignore=tests/test_layout.py --ignore=tests/test_hover_actions.py --ignore=tests/visual_qa.py
