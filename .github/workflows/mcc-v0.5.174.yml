name: MCC validation

on:
  push:
    branches: [fix/mcc-v0.5.174-workflow]
  pull_request:

jobs:
  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile current MCC source
        run: python -m py_compile "Music Collection Cleaner v0.05.174.pyw"
      - name: Run regression suite
        run: python -m unittest discover -s tests -p "test_*.py"

  baseline-v173:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.5.173
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile v0.5.173 release source
        run: python -m py_compile "Music.Collection.Cleaner.v0.05.173.pyw"
      - name: Run baseline regression suite
        env:
          MCC_TEST_SOURCE: Music.Collection.Cleaner.v0.05.173.pyw
        run: python -m unittest discover -s tests -p "test_*.py"
