name: MCC validation

on:
  push:
    branches: [fix/mcc-v0.5.174-workflow]
  pull_request:

jobs:
  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile current MCC source
        run: python -m py_compile "Music Collection Cleaner v0.05.174.pyw"
      - name: Run regression suite
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Retain source and tests for validation
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcc-v0.5.174-validation-source
          path: |
            Music Collection Cleaner v0.05.174.pyw
            tests/

  browser-visual-qa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: python -m pip install playwright
      - name: Render and exercise the embedded Release Map in Edge
        run: python tests/visual_qa.py --browser edge --output visual-qa
      - name: Preserve QA screenshots and report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcc-v0.5.174-visual-qa
          path: visual-qa/
